# UI-free application core: identity import/create, derivation, chain
# client, store, compose orchestration. Host-testable: cargo test -p app-core.
#
# notes-core (pinned rev) provides the FROZEN protocol pieces — PNTE
# envelope, XChaCha20 sealing, dm ECDH, taproot tx build/sign, extract —
# so note txs are byte-identical to the Prime app's by construction.
# Its workspace [patch] getrandom/TRNG override deliberately does NOT
# propagate here: on the host we want OS randomness.
#
# rust-bitcoin is a first-class dependency here (unlike on KeyOS, where
# pure-Rust-only rules it out): BIP-32/86 derivation, WIF/xprv parsing.
[package]
name = "app-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
notes-core = { git = "ssh://git@github.com/ObjSal/prime-chain-notes.git", rev = "15431fbc74b2b761edf78a4f533673a89507585d" }
# base64 feature = PSBT <-> base64 string (`.psbt` file / clipboard export).
bitcoin = { version = "0.32", features = ["base64"] }
# Output-descriptor parsing + address derivation for external funding wallets
# (watch-only). Pairs with bitcoin 0.32.
miniscript = "12"
# Animated crypto-psbt UR (BCR-2020-006) framing for QR export/import — the
# EXACT codec the KeyOS scanner runs, so the Prime app reassembles our frames.
foundation-ur = "0.4"
# CBOR decode for UR crypto-account / crypto-output-descriptor / crypto-hdkey
# (BCR-2020-007/010/015) — hardware-wallet account-export QR import.
ciborium = "0.2"
bip39 = "2"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls so no system TLS/openssl is needed inside the Nix shell.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[dev-dependencies]
# Fixture generator for the flagship import path: the parity tests feed
# REAL prime-bip85 outputs (mnemonic/WIF/XPRV/hex + SeedQR digits)
# through our importer — no hand-copied vectors.
bip85-core = { git = "ssh://git@github.com/ObjSal/prime-bip85.git", rev = "dbc446534e67314d40c06c3261812fccede3ec29" }
