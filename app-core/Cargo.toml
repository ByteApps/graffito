# UI-free application core: identity import/create, derivation, chain
# client, store, compose orchestration. Host-testable: cargo test -p app-core.
#
# notes-core (pinned rev) provides the FROZEN protocol pieces — PNTE
# envelope, XChaCha20 sealing, dm ECDH, taproot tx build/sign, extract —
# so note txs are byte-identical to the Prime app's by construction.
# Its workspace [patch] getrandom/TRNG override deliberately does NOT
# propagate here: on the host we want OS randomness.
#
# rust-bitcoin is a first-class dependency here (unlike on KeyOS, where
# pure-Rust-only rules it out): BIP-32/86 derivation, WIF/xprv parsing.
[package]
name = "app-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
notes-core = { git = "ssh://git@github.com/ByteApps/prime-graffito.git", rev = "85017f3b64b73a27eeeb9ca1ae60b021e3b4f09c" }
# base64 feature = PSBT <-> base64 string (`.psbt` file / clipboard export).
bitcoin = { version = "0.32", features = ["base64"] }
# Output-descriptor parsing + address derivation for external funding wallets
# (watch-only). Pairs with bitcoin 0.32.
miniscript = "12"
# Animated crypto-psbt UR (BCR-2020-006) framing for QR export/import — the
# EXACT codec the KeyOS scanner runs, so the Prime app reassembles our frames.
foundation-ur = "0.4"
# CBOR decode for UR crypto-account / crypto-output-descriptor / crypto-hdkey
# (BCR-2020-007/010/015) — hardware-wallet account-export QR import.
ciborium = "0.2"
bip39 = "2"
# Passphrase-strength estimation for the optional PQ passphrase layer on
# directed private notes (see passphrase.rs) — dictionary/pattern-aware
# guess estimation, not a naive charset-entropy formula.
zxcvbn = "3"
hkdf = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls so no system TLS/openssl is needed inside the Nix shell.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
# pgp_import.rs: parses RFC 9980 OpenPGP keys (algorithm 35, ML-KEM-768+
# X25519 composite) to extract the ML-KEM component for note encryption.
# No default features (drops bzip2 message decompression — irrelevant
# here, mirrors pgp-core's own choice). `draft-pqc` is what exposes the
# algorithm-35 (de)serialization plus the `crypto::ml_kem768_x25519` /
# `crypto::ml_kem1024_x448` composite modules pgp_import.rs also reuses
# to expand a bare native-armor ML-KEM seed into its encapsulation key.
pgp = { version = "=0.20.0", default-features = false, features = ["draft-pqc"] }
# Graffito-native armor's payload encoding ("standard base64" per spec).
base64 = "0.22"

[dev-dependencies]
# Fixture generator for the flagship import path: the parity tests feed
# REAL prime-bip85 outputs (mnemonic/WIF/XPRV/hex + SeedQR digits)
# through our importer — no hand-copied vectors.
bip85-core = { git = "ssh://git@github.com/ByteApps/prime-bip85.git", rev = "dbc446534e67314d40c06c3261812fccede3ec29" }
# tests/entropy.rs drives the raw OS source directly (integration tests
# can't see a crate's normal `[dependencies]`) — pinned to the same 0.2
# major already resolved above, so it's the SAME getrandom, not a second
# copy.
getrandom = "0.2"
# tests/pgp_import.rs: generates real algorithm-35 fixtures (mirrors
# prime-openpgp-keys/pgp-core's keygen) and proves the extracted ek/
# secret are correct by encapsulating/decapsulating directly against the
# standalone ml-kem crate rpgp uses internally. Never a REGULAR
# dependency of app-core — production code only expands a seed through
# rpgp's own composite modules (see pgp_import.rs module docs).
ml-kem = "0.2"
# Same major rpgp's own code uses; needed for `generate_pqc_hybrid`'s
# `rand::thread_rng()` (matches the `Rng` bound rpgp's `.generate()`
# takes) and for driving ml-kem's encapsulate/decapsulate in tests.
rand = "0.8"
