[package]
name = "chain-notes-app"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native Mac/iOS/Android peer for chain notes (PNTE protocol)"

[workspace]
members = ["app-core"]

[dependencies]
app-core = { path = "app-core" }
slint = "=1.16.1"
# QR out: rendered into a slint Image.
qrcode = "0.14"
# QR in: camera frames (AVFoundation on Mac) → rqrr decode.
nokhwa = { version = "0.10", features = ["input-avfoundation"] }
rqrr = "0.7"
# Key material at rest: macOS Keychain (SecretStore spec in the PLAN).
security-framework = "3"
# Raw SecItemAdd/CopyMatching for the UserPresence ACL item (the high-
# level item API has no access-control setter).
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
# Dev-build fallback: LAContext user-presence gate (unsigned binaries
# cannot use SecAccessControl items — errSecMissingEntitlement).
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"
# Native file-open dialog (import-from-file door).
rfd = "0.14"
serde_json = "1"
hex = "0.4"
zeroize = "1"
# Quiz word picks + misc entropy.
getrandom = "0.2"
bip39 = "2"

[build-dependencies]
slint-build = "=1.16.1"

# Slint's text shaper (harfrust, via parley) has an integer add that overflows
# on very large single text runs. Release wraps it (overflow-checks off by
# default), but debug builds panic-abort — crashing the app on a huge paste
# into the compose field. Match release behaviour in debug so the shaper can't
# abort. NB: still present in harfrust 0.8.4 (Slint 1.17), so a Slint bump does
# NOT remove the need for this — verified 2026-07-06.
[profile.dev.package.harfrust]
overflow-checks = false
