[package]
name = "chain-notes-app"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Native Mac/iOS/Android peer for chain notes (PNTE protocol)"

[workspace]
members = ["app-core"]

# Cross-platform (macOS desktop + iOS/Android mobile). Platform-specific glue
# (Slint renderer, camera, file dialogs, keychain) is target-gated below and
# cfg-split in the modules; app logic + UI (app.slint) are shared.
[dependencies]
app-core = { path = "app-core" }
# PNG encode for `--render` snapshots (macOS dev tool).
png = "0.17"
# QR out: rendered into a slint Image.
qrcode = "0.14"
# QR in: camera frames → rqrr decode.
rqrr = "0.7"
serde_json = "1"
hex = "0.4"
zeroize = "1"
# Quiz word picks + misc entropy.
getrandom = "0.2"
bip39 = "2"

# Apple platforms (macOS + iOS) — Keychain + LAContext biometric reveal.
[target.'cfg(target_vendor = "apple")'.dependencies]
# Key material at rest: Keychain (SecretStore spec in the PLAN).
security-framework = "3"
# Raw SecItemAdd/CopyMatching for the UserPresence ACL item (the high-
# level item API has no access-control setter).
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
# LAContext user-presence gate; on iOS the SecAccessControl reveal prompt.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"

# macOS desktop: femtovg default + software renderer for --render; native glue.
[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "=1.16.1", features = ["renderer-software"] }
# QR in: camera frames (AVFoundation via nokhwa) → rqrr decode.
nokhwa = { version = "0.10", features = ["input-avfoundation"] }
# Native file-open dialog (import-from-file door).
rfd = "0.14"

# iOS: winit + Skia (Metal); femtovg/GL-ES and nokhwa/rfd are not available.
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "=1.16.1", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-skia"] }
# Safe-area insets (status bar / Dynamic Island / home indicator).
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIWindow", "UIView", "UIResponder", "objc2-core-foundation"] }
objc2-core-foundation = "0.3"
# Camera capture: AVCaptureSession + video-data-output → CVPixelBuffer luma → rqrr.
objc2-av-foundation = { version = "0.3", features = [
    "AVCaptureSession", "AVCaptureDevice", "AVCaptureInput", "AVCaptureOutput",
    "AVCaptureVideoDataOutput", "AVMediaFormat", "dispatch2",
] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMFormatDescription", "CMTime"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }
dispatch2 = "0.3"

[build-dependencies]
slint-build = "=1.16.1"

# Slint's text shaper (harfrust, via parley) has an integer add that overflows
# on very large single text runs. Release wraps it (overflow-checks off by
# default), but debug builds panic-abort — crashing the app on a huge paste
# into the compose field. Match release behaviour in debug so the shaper can't
# abort. NB: still present in harfrust 0.8.4 (Slint 1.17), so a Slint bump does
# NOT remove the need for this — verified 2026-07-06.
[profile.dev.package.harfrust]
overflow-checks = false
