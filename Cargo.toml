[package]
name = "graffito"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Native Mac/iOS/Android peer for Graffito (PNTE protocol)"

[workspace]
# notes-core (FROZEN PNTE protocol) and graffito-core (shared UI-free policy)
# moved here from ByteApps/prime-graffito on 2026-09-02 when the Prime app
# was shelved; that app now pins them as git dependencies of THIS repo.
members = ["app-core", "notes-core", "graffito-core"]

# The code lives in a lib so BOTH the desktop/iOS bin (fn main) and the
# Android cdylib (android_main, loaded by NativeActivity) can share it.
[lib]
crate-type = ["lib", "cdylib"]

[[bin]]
name = "graffito"
path = "src/main.rs"

# Cross-platform (macOS desktop + iOS/Android mobile). Platform-specific glue
# (Slint renderer, camera, file dialogs, keychain) is target-gated below and
# cfg-split in the modules; app logic + UI (app.slint) are shared.
[dependencies]
app-core = { path = "app-core" }
# PNG encode for `--render` snapshots (macOS dev tool).
png = "0.17"
# QR out: rendered into a slint Image.
qrcode = "0.14"
# QR in: camera frames → rqrr decode.
rqrr = "0.10"
serde_json = "1"
hex = "0.4"
zeroize = "1"
# Quiz word picks + misc entropy.
getrandom = "0.2"
bip39 = "2"

# Apple platforms (macOS + iOS) — Keychain + LAContext biometric reveal.
[dev-dependencies]
# In-process, headless Slint UI testing (ElementHandle: find_by_accessible_label
# / single_click) — drives the real AppWindow with NO window, focus, or
# coordinates. See tests/ui_harness_spike.rs and the graffito-mac-ui memory.
i-slint-backend-testing = "=1.17.1"

[target.'cfg(target_vendor = "apple")'.dependencies]
# Key material at rest: Keychain (SecretStore spec in the PLAN).
security-framework = "3"
# Raw SecItemAdd/CopyMatching for the UserPresence ACL item (the high-
# level item API has no access-control setter).
security-framework-sys = "2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
# LAContext user-presence gate; on iOS the SecAccessControl reveal prompt.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-local-authentication = "0.3"
block2 = "0.6"

# macOS desktop: femtovg default + software renderer for --render; native glue.
[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "=1.17.1", features = ["renderer-software"] }
# QR in: camera frames (AVFoundation via nokhwa) → rqrr decode.
nokhwa = { version = "0.10", features = ["input-avfoundation"] }
# Native file-open dialog (import-from-file door).
rfd = "0.14"

# iOS: winit + Skia (Metal); femtovg/GL-ES and nokhwa/rfd are not available.
[target.'cfg(target_os = "ios")'.dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-skia"] }
# Safe-area insets (status bar / Dynamic Island / home indicator).
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIWindow", "UIView", "UIResponder", "UIPasteboard", "objc2-core-foundation"] }
objc2-core-foundation = "0.3"
# Camera capture: AVCaptureSession + video-data-output → CVPixelBuffer luma → rqrr.
objc2-av-foundation = { version = "0.3", features = [
    "AVCaptureSession", "AVCaptureSessionPreset", "AVCaptureDevice", "AVCaptureInput",
    "AVCaptureOutput", "AVCaptureVideoDataOutput", "AVMediaFormat", "dispatch2",
] }
objc2-core-media = { version = "0.3", features = ["CMSampleBuffer", "CMFormatDescription", "CMTime"] }
objc2-core-video = { version = "0.3", features = ["CVPixelBuffer", "CVImageBuffer", "CVBuffer", "CVReturn", "CVBase"] }
dispatch2 = "0.3"

# Android: winit/android-activity + Skia (GL-ES). Keystore + camera go
# through JNI (jni + ndk-context give the JavaVM + Activity from the
# android-activity NativeActivity that Slint boots).
[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["compat-1-2", "backend-android-activity-06", "renderer-skia"] }
jni = "0.21"
ndk-context = "0.1"

# cargo-apk packaging (NativeActivity via android-activity). Build:
#   cargo apk build --lib --target aarch64-linux-android
[package.metadata.android]
package = "xyz.foundation.graffito.app"
build_targets = ["aarch64-linux-android"]
# Launcher icon: adaptive (anydpi-v26 fg/bg layers) + legacy mipmaps,
# all generated from assets/icon/icon.svg.
resources = "assets/icon/android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Graffito"
icon = "@mipmap/ic_launcher"
# NoActionBar: the device-default theme carries a 56dp ActionBar the GL
# surface never draws, but it still inflates the NativeActivity content rect —
# safe_area_insets read ~105dp of top inset instead of the ~49dp status bar,
# pushing every screen's header way down (found on the Pixel 6 emulator).
theme = "@android:style/Theme.DeviceDefault.NoActionBar"

# Dev/emulator release signing uses the standard Android debug keystore
# (a real Play release would swap in a private upload key). cargo-apk
# does not expand `$HOME`/`~` in a manifest `path` (confirmed from its
# source — the TOML value is used as a literal PathBuf), so rather than
# hardcode a per-machine home directory here, this block is omitted and
# cargo-apk's own env-var override is used instead: it checks
# `CARGO_APK_RELEASE_KEYSTORE(_PASSWORD)` before falling back to this
# manifest section, and (for the plain, non-`--release` dev profile)
# auto-locates/creates the debug keystore on its own with no config at
# all. Set the two env vars locally — see
# ../private/graffito/signing.env — before `cargo apk build
# --release`; plain `cargo apk build` needs nothing.

# Chain sync + broadcast (esplora/mempool.space over HTTPS). cargo-apk
# does NOT add INTERNET automatically for NativeActivity apps.
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

# QR scan (camera) — also requested at runtime via BiometricPrompt-free
# NDK Camera2; the manifest permission is the install-time half.
[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

# Reveal gate. Without this BiometricPrompt.authenticate throws a
# SecurityException, which the bridge catches and reports as a denial — so the
# symptom is "reveal always refused, no dialog ever appears", not a crash.
# Found exactly that way on the emulator.
[[package.metadata.android.uses_permission]]
name = "android.permission.USE_BIOMETRIC"

[[package.metadata.android.uses_feature]]
name = "android.hardware.camera.any"
required = false

[build-dependencies]
slint-build = "=1.17.1"

# APP STORE BLOCKER — do not drop this patch. slint pulls in winit, whose macOS
# backend declares the PRIVATE `CGSSetWindowBackgroundBlurRadius` /
# `CGSMainConnectionID` in `platform_impl/macos/ffi.rs` and calls them from
# `WindowDelegate::set_blur`. Nothing in slint ever calls `Window::set_blur`, but
# the extern block plus its one dead call site is enough to leave both symbols in
# the binary's undefined symbol table (rustc does not pass `-dead_strip` for this
# link), and Apple's static analysis rejects on the reference alone:
#
#   The app uses or references the following non-public or deprecated APIs:
#   • _CGSSetWindowBackgroundBlurRadius
#
# (macOS 1.0 build 31, rejected 2026-07-28.) Upstream master hides them behind a
# non-default `private-apple-apis` feature, but that gate does not exist on the
# 0.30 branch and i-slint-backend-winit 1.17.1 requires winit ^0.30.2 — so the
# fork below is v0.30.13 with those two entry points deleted and `set_blur` made
# a no-op. Nothing else differs. Verify after any slint/winit bump with
# `scripts/check-private-apis.sh` (also run from build_mac.bash / build_ios.bash).
[patch.crates-io]
winit = { git = "https://github.com/ByteApps/winit", rev = "cea753eacbc334b1b61056efb6690075b5235cf1" }

# Slint's text shaper (harfrust, via parley) has an integer add that overflows
# on very large single text runs. Release wraps it (overflow-checks off by
# default), but debug builds panic-abort — crashing the app on a huge paste
# into the compose field. Match release behaviour in debug so the shaper can't
# abort. NB: still present in harfrust 0.8.4 (Slint 1.17), so a Slint bump does
# NOT remove the need for this — verified 2026-07-06.
[profile.dev.package.harfrust]
overflow-checks = false

# Android/iOS release .so ships stripped — the debug cdylib is ~370 MB
# (skia + full debug info) and blows past the emulator's internal storage.
[profile.release]
strip = true
