name: chain-notes-app
options:
  bundleIdPrefix: xyz.foundation.chainnotes
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  chain-notes-app:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.foundation.chainnotes.app
        PRODUCT_NAME: chain-notes-app
        EXECUTABLE_NAME: chain-notes-app
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: VU7QD3Z26Y
        GENERATE_INFOPLIST_FILE: NO
        # No custom app icon; without this actool errors once a catalog exists.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Chain Notes
        CFBundleExecutable: chain-notes-app
        NSCameraUsageDescription: "Scan QR codes (keys, addresses, PSBTs, sync bundles)."
        NSFaceIDUsageDescription: "Unlock your notes key to reveal your backup."
        # Dark launch background (matches Pal.bg) so the cold-start flash isn't
        # white — the colour lives in Assets.xcassets/LaunchBackground.colorset.
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    sources:
      - Assets.xcassets
    postCompileScripts:
      - name: Build Rust binary with cargo
        script: |
          bash "${SRCROOT}/build_ios.bash" chain-notes-app
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
